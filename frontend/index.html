<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clutch</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/themes.css" />
  <link rel="stylesheet" href="css/styles.css" />
</head>

<body>
  <div class="app">

    <!-- Header  -->
    <div class="header">

      <!--Ide Name-->
      <span class="app-name">Clutch</span>

      <div class="header-right">

        <!--Dropdown and Features-->
        <button id="sidebar-toggle" class="sidebar-toggle" title="Toggle Sidebar">Explorer</button>
        <button id="theme-toggle" class="theme-toggle" title="Switch to Light Mode">
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
          </svg>
        </button>

        <select id="language">
          <option value="javascript">JavaScript</option>
          <option value="typescript">TypeScript</option>
          <option value="python">Python</option>
          <option value="java">Java</option>
          <option value="csharp">C#</option>
          <option value="cpp" selected>C++</option>
          <option value="c">C</option>
          <option value="go">Go</option>
          <option value="rust">Rust</option>
        </select>

        <button id="run-button">Run</button>
        <button id="export-button" class="export-btn">Export</button>
        <button id="clear-session" class="clear-session-btn">Clear Session</button>

      </div>
    </div>


    <!-- Tabs Bar -->
    <div class="tab-bar" id="tab-bar">
      <button class="new-file-btn" id="new-file-btn">+</button>
    </div>


    <div class="workspace">
      
      <aside id="sidebar" class="sidebar">
        <div class="sidebar-header">
          <span>Explorer</span>
          <div class="sidebar-actions">
            <button id="sidebar-new-file" class="sidebar-action-btn" title="New File" aria-label="New File">
              <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z" />
                <polyline points="14 3 14 9 20 9" />
                <line x1="12" y1="12" x2="12" y2="18" />
                <line x1="9" y1="15" x2="15" y2="15" />
              </svg>
            </button>
            <button id="sidebar-new-folder" class="sidebar-action-btn" title="New Folder" aria-label="New Folder">
              <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M3 6a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
                <line x1="12" y1="10" x2="12" y2="16" />
                <line x1="9" y1="13" x2="15" y2="13" />
              </svg>
            </button>
          </div>
        
        </div>
        <div id="sidebar-tree" class="sidebar-tree">
          <div class="sidebar-empty">No files listed yet</div>
        </div>
      </aside>

      <!-- Editor -->
      <div class="editor-shell">
        <div id="editor-loading" class="editor-loading" role="status" aria-live="polite">
          <div class="editor-loading-spinner" aria-hidden="true"></div>
          <p>Loading editor...</p>
        </div>
        <div id="editor"></div>
      </div>



    </div>




    <!-- Input And Output -->
    <div class="io">

      <!-- Input  -->
      <div class="io-panel">
        <div class="io-label">Input</div>
        <textarea id="input" placeholder="Enter your input here..."></textarea>
      </div>

      <!-- Output -->
      <div class="io-panel">
        <div class="io-label">Output</div>
        <div class="output-meta">
          <span id="status-badge" class="status-badge">Ready</span>
          <button id="copy-output" class="output-btn">Copy</button>
          <button id="clear-output" class="output-btn">Clear</button>
          <span id="exec-meta" class="exec-meta">Time: -s | Memory: - KB</span>
        </div>
        <pre id="output"></pre>
      </div>
    </div>
  </div>



  <!-- Context Menu -->
  <ul id="context-menu" class="hidden">
    <li data-action="rename">Rename</li>
    <li data-action="duplicate">Duplicate</li>
    <li data-action="close">Close</li>
    <li data-action="close-others">Close Others</li>
  </ul>

  <!-- Scripts -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/loader.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="js/themes.js"></script>
  <script type="module" src="js/files.js"></script>
  <script type="module" src="js/editor.js"></script>
  <script type="module" src="js/api.js"></script>
  <script type="module" src="js/app.js"></script>
  <script type="module" src="js/shortcuts.js"></script>
  <script type="module" src="js/storage.js"></script>

</body>

</html>
