<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clutch</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
  <link rel="stylesheet" href="css/themes.css" />
  <link rel="stylesheet" href="css/styles.css" />
</head>

<body>
  <div class="app">

    <!-- Header  -->
    <div class="header">

      <!--Ide Name-->
      <span class="app-name">Clutch</span>

      <div class="header-right">

        <!--Dropdown and Features-->
        <button id="sidebar-toggle" class="sidebar-toggle" title="Toggle Sidebar">Explorer</button>
        <button id="theme-toggle" class="theme-toggle" title="Switch to Light Mode" aria-label="Switch to Light Mode">
          <span data-ui-icon="theme-dark" aria-hidden="true"></span>
        </button>

        <select id="language">
          <option value="javascript">JavaScript</option>
          <option value="typescript">TypeScript</option>
          <option value="python">Python</option>
          <option value="java">Java</option>
          <option value="csharp">C#</option>
          <option value="cpp" selected>C++</option>
          <option value="c">C</option>
          <option value="go">Go</option>
          <option value="rust">Rust</option>
        </select>

        <button id="run-button">Run</button>
        <button id="export-button" class="export-btn">Export</button>
        <button id="clear-session" class="clear-session-btn">Clear Session</button>

      </div>
    </div>


    <!-- Tabs Bar -->
    <div class="tab-bar" id="tab-bar">
      <button class="new-file-btn" id="new-file-btn" title="New File" aria-label="New File">
        <span data-ui-icon="tab-add-file" aria-hidden="true"></span>
      </button>
    </div>

    <!-- Workspace -->
    <div class="workspace">
      
      <aside id="sidebar" class="sidebar">
        <div class="sidebar-header">
          <span>Explorer</span>
          <div class="sidebar-actions">
            <button id="sidebar-new-file" class="sidebar-action-btn" title="New File" aria-label="New File">
              <span data-ui-icon="sidebar-add-file" aria-hidden="true"></span>
            </button>
            <button id="sidebar-new-folder" class="sidebar-action-btn" title="New Folder" aria-label="New Folder">
              <span data-ui-icon="sidebar-add-folder" aria-hidden="true"></span>
            </button>
          </div>
        
        </div>
        <div id="sidebar-tree" class="sidebar-tree">
          <div class="sidebar-empty">No files listed yet</div>
        </div>
      </aside>

      <!-- Editor -->
      <div class="editor-shell">
        <div id="editor-loading" class="editor-loading" role="status" aria-live="polite">
          <div class="editor-loading-spinner" aria-hidden="true"></div>
          <p>Loading editor...</p>
        </div>
        <div id="editor"></div>
      </div>



    </div>




    <!-- Input And Output -->
    <div class="io">

      <!-- Input  -->
      <div class="io-panel">
        <div class="io-label">Input</div>
        <textarea id="input" placeholder="Enter your input here..."></textarea>
      </div>

      <!-- Output -->
      <div class="io-panel">
        <div class="io-label">Output</div>
        <div class="output-meta">
          <span id="status-badge" class="status-badge">Ready</span>
          <button id="copy-output" class="output-btn">Copy</button>
          <button id="clear-output" class="output-btn">Clear</button>
          <span id="exec-meta" class="exec-meta">Time: -s | Memory: - KB</span>
        </div>
        <pre id="output"></pre>
      </div>
    </div>
  </div>



  <!-- Context Menu -->
  <ul id="context-menu" class="hidden">
    <li data-action="rename">
      <span data-ui-icon="action-rename" data-ui-icon-class="context-action-icon" aria-hidden="true"></span>
      <span>Rename</span>
    </li>
    <li data-action="delete">
      <span data-ui-icon="action-delete" data-ui-icon-class="context-action-icon" aria-hidden="true"></span>
      <span>Delete</span>
    </li>
  </ul>

  <!-- Scripts -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/loader.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="js/ui-icons.js"></script>
  <script src="js/themes.js"></script>
  <script type="module" src="js/files.js"></script>
  <script type="module" src="js/editor.js"></script>
  <script type="module" src="js/api.js"></script>
  <script type="module" src="js/app.js"></script>
  <script type="module" src="js/shortcuts.js"></script>
  <script type="module" src="js/storage.js"></script>

</body>

</html>
